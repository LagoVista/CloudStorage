services:
  cassandra:
    build:
      context: .
      dockerfile: Dockerfile.cassandra-tests
    image: nuviot/cloudstorage-cassandra-tests:5.0
    container_name: nuviot-cloudstorage-cassandra-tests
    ports:
      - "19042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: NuvIoTCloudStorageTests
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
    healthcheck:
      test: ["CMD-SHELL", "nodetool status 2>/dev/null | grep -Eq '^UN[[:space:]]' || exit 1"]
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 20s

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coverage Board</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; padding: 24px; background: Canvas; color: CanvasText; }
    header { display: flex; gap: 16px; align-items: end; justify-content: space-between; flex-wrap: wrap; margin-bottom: 18px; }
    h1 { margin: 0 0 4px; font-size: 1.55rem; }
    #description { margin: 0; opacity: .72; max-width: 820px; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; }
    select, button { font: inherit; padding: 7px 10px; border: 1px solid color-mix(in srgb, CanvasText 22%, transparent); border-radius: 7px; background: Canvas; color: CanvasText; }
    button { cursor: pointer; }
    #summary { display: flex; gap: 14px; margin: 0 0 18px; font-size: .9rem; opacity: .78; flex-wrap: wrap; }
    #board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
    .lane { border: 1px solid color-mix(in srgb, CanvasText 15%, transparent); border-radius: 10px; padding: 12px; background: color-mix(in srgb, Canvas 96%, CanvasText 4%); min-width: 0; }
    .lane-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .lane h2 { font-size: 1rem; margin: 0; text-transform: capitalize; }
    .count { font-size: .8rem; opacity: .65; }
    .cards { display: grid; gap: 10px; }
    .card { border: 1px solid color-mix(in srgb, CanvasText 14%, transparent); border-radius: 8px; padding: 11px; background: Canvas; }
    .card h3 { margin: 0 0 6px; font-size: .96rem; line-height: 1.28; }
    .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .tag { border-radius: 999px; padding: 2px 7px; font-size: .72rem; background: color-mix(in srgb, CanvasText 8%, transparent); }
    .summary { margin: 0 0 9px; font-size: .84rem; line-height: 1.4; opacity: .8; }
    details { font-size: .79rem; }
    details summary { cursor: pointer; opacity: .75; }
    ul { margin: 6px 0 0; padding-left: 20px; }
    .empty { font-size: .84rem; opacity: .55; padding: 8px 2px; }
    #error { display: none; padding: 12px; border: 1px solid currentColor; border-radius: 8px; margin-bottom: 16px; }
    @media (max-width: 850px) { #board { grid-template-columns: 1fr; } body { padding: 16px; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1 id="title">Coverage Board</h1>
      <p id="description">Loading…</p>
    </div>
    <div class="filters">
      <select id="category" aria-label="Filter by category"><option value="">All categories</option></select>
      <select id="area" aria-label="Filter by area"><option value="">All areas</option></select>
      <button id="reload" type="button">Reload</button>
    </div>
  </header>

  <div id="error" role="alert"></div>
  <div id="summary"></div>
  <main id="board"></main>

  <script>
    const laneOrder = ['backlog', 'in-process', 'completed'];
    let board = null;
    let cards = [];

    const esc = value => String(value ?? '').replace(/[&<>\"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[ch]));
    const nice = value => String(value ?? '').replace(/-/g, ' ');

    async function load() {
      hideError();
      try {
        const boardResponse = await fetch('board.json', { cache: 'no-store' });
        if (!boardResponse.ok) throw new Error(`Could not load board.json (${boardResponse.status})`);
        board = await boardResponse.json();
        const results = await Promise.all((board.cards || []).map(async path => {
          const response = await fetch(path, { cache: 'no-store' });
          if (!response.ok) throw new Error(`Could not load ${path} (${response.status})`);
          const card = await response.json();
          card.__path = path;
          return card;
        }));
        cards = results;
        populateFilters();
        render();
      } catch (err) {
        showError(`${err.message}. Serve the repository through a local HTTP server rather than opening this file directly.`);
      }
    }

    function populateFilters() {
      const category = document.getElementById('category');
      const area = document.getElementById('area');
      const categoryValue = category.value;
      const areaValue = area.value;
      category.innerHTML = '<option value="">All categories</option>';
      area.innerHTML = '<option value="">All areas</option>';
      [...new Set(cards.map(c => c.category).filter(Boolean))].sort().forEach(value => category.add(new Option(nice(value), value)));
      [...new Set(cards.map(c => c.area).filter(Boolean))].sort().forEach(value => area.add(new Option(nice(value), value)));
      category.value = categoryValue;
      area.value = areaValue;
    }

    function render() {
      document.getElementById('title').textContent = board?.name || 'Coverage Board';
      document.getElementById('description').textContent = board?.description || '';
      const category = document.getElementById('category').value;
      const area = document.getElementById('area').value;
      const visible = cards.filter(c => (!category || c.category === category) && (!area || c.area === area));
      const completed = visible.filter(c => c.status === 'completed').length;
      document.getElementById('summary').innerHTML = `<span><strong>${visible.length}</strong> cards</span><span><strong>${completed}</strong> completed</span><span><strong>${visible.length ? Math.round(completed / visible.length * 100) : 0}%</strong> coverage</span>`;

      const container = document.getElementById('board');
      container.innerHTML = '';
      laneOrder.forEach(status => {
        const laneCards = visible.filter(c => c.status === status);
        const lane = document.createElement('section');
        lane.className = 'lane';
        lane.innerHTML = `<div class="lane-header"><h2>${esc(nice(status))}</h2><span class="count">${laneCards.length}</span></div><div class="cards"></div>`;
        const cardContainer = lane.querySelector('.cards');
        if (!laneCards.length) cardContainer.innerHTML = '<div class="empty">Nothing here.</div>';
        laneCards.forEach(card => cardContainer.appendChild(renderCard(card)));
        container.appendChild(lane);
      });
    }

    function renderCard(card) {
      const el = document.createElement('article');
      el.className = 'card';
      const coverage = Array.isArray(card.coverage) ? card.coverage : [];
      const sources = Array.isArray(card.source) ? card.source : [];
      const tests = Array.isArray(card.tests) ? card.tests : [];
      const details = [];
      if (coverage.length) details.push(`<details><summary>Coverage (${coverage.length})</summary><ul>${coverage.map(x => `<li>${esc(nice(x))}</li>`).join('')}</ul></details>`);
      if (sources.length) details.push(`<details><summary>Source (${sources.length})</summary><ul>${sources.map(x => `<li><code>${esc(x)}</code></li>`).join('')}</ul></details>`);
      if (tests.length) details.push(`<details><summary>Tests (${tests.length})</summary><ul>${tests.map(x => `<li><code>${esc(x)}</code></li>`).join('')}</ul></details>`);
      el.innerHTML = `<h3>${esc(card.title)}</h3><div class="meta"><span class="tag">${esc(nice(card.category))}</span>${card.area ? `<span class="tag">${esc(nice(card.area))}</span>` : ''}${card.component ? `<span class="tag">${esc(card.component)}</span>` : ''}</div><p class="summary">${esc(card.summary || '')}</p>${details.join('')}`;
      return el;
    }

    function showError(message) { const el = document.getElementById('error'); el.textContent = message; el.style.display = 'block'; }
    function hideError() { document.getElementById('error').style.display = 'none'; }

    document.getElementById('category').addEventListener('change', render);
    document.getElementById('area').addEventListener('change', render);
    document.getElementById('reload').addEventListener('click', load);
    load();
  </script>
</body>
</html>
